name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/install.sh tests/install_test.sh
      - run: shellcheck scripts/install.sh tests/install_test.sh
      - run: ./tests/install_test.sh
      - run: |
          while IFS= read -r -d '' skill_md; do
            dir=${skill_md%/*}
            declared_name=$(sed -n '2s/^name:[[:space:]]*//p' "$skill_md")
            test "$(basename "$dir")" = "$declared_name"
          done < <(find skills -mindepth 3 -maxdepth 3 -name SKILL.md -print0)
